services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hou53-api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hou53-frontend
    depends_on:
      - api
    ports:
      - "8080:80"
